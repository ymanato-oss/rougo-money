<style>
/* 金融庁シミュレーターに揃えた「白地の公的ツール」的な見え方に統一するため、
   ダークテーマは意図的に採用せず、トークンを .app に閉じて常にライトで描画する */
.app{
  color-scheme: light;
  --surface-1:#ffffff;
  --page:#f4f7fb;
  --text-primary:#0b0b0b;
  --text-secondary:#52514e;
  --muted:#767570;
  --grid:#e6e9ef;
  --baseline:#c3c2b7;
  --border:rgba(11,11,11,0.10);
  --series-1:#2a78d6;   /* 積立元本 */
  --series-2:#eb6834;   /* 運用でふえる分 */
  --accent:#1b5fb0;
  --accent-soft:#eaf2fd;
  --good:#006300;
  --radius:14px;

  min-height:100vh;
  background:var(--page);
  color:var(--text-primary);
  font-family:system-ui,-apple-system,"Segoe UI","Hiragino Sans","Noto Sans JP",sans-serif;
  line-height:1.7;
  -webkit-text-size-adjust:100%;
}
.app *{box-sizing:border-box;}
.wrap{max-width:720px;margin:0 auto;padding:0 16px 80px;}

/* ---------- ヘッダー ---------- */
.app-header{background:var(--accent);color:#fff;padding:26px 16px 24px;text-align:center;}
.app-header h1{margin:0;font-size:25px;font-weight:700;letter-spacing:.02em;}

/* ---------- ステップ表示（進んだところは押して戻れる／上に貼りつく） ---------- */
.steps{
  position:sticky;top:0;z-index:20;
  display:flex;gap:8px;
  margin:0 -16px 16px;padding:16px 16px 14px;
  background:var(--page);
}
.steps button{
  flex:1;text-align:center;font-size:14px;padding:9px 4px;border-radius:999px;
  background:#e4e8ee;color:var(--muted);font-weight:600;
  border:1.5px solid transparent;font-family:inherit;cursor:default;
}
.steps button.done{background:#fff;border-color:var(--accent);color:var(--accent);cursor:pointer;}
.steps button.done:hover{background:var(--accent-soft);}
.steps button.on{background:var(--accent);border-color:var(--accent);color:#fff;cursor:default;}
.steps button:focus-visible{outline:3px solid var(--accent);outline-offset:2px;}

/* ---------- カード ---------- */
.card{
  background:var(--surface-1);border:1px solid var(--border);
  border-radius:var(--radius);padding:24px 20px;margin-bottom:16px;
}
.app h2{font-size:21px;margin:0 0 18px;}

/* ---------- 戻るリンク ---------- */
.back{
  background:none;border:0;font-family:inherit;font-size:15px;color:var(--accent);
  cursor:pointer;padding:0;margin:0 0 16px;display:inline-block;font-weight:600;
}
.back:hover{text-decoration:underline;}
.back:focus-visible{outline:3px solid var(--accent);outline-offset:2px;}

/* ---------- 入力 ---------- */
.field{margin-bottom:24px;}
.field label{display:block;font-size:17px;font-weight:700;margin-bottom:8px;}
.field .help{font-size:14.5px;color:var(--muted);margin:-4px 0 8px;line-height:1.6;}
.row{display:flex;align-items:center;gap:12px;}
.app input[type=range]{flex:1;accent-color:var(--accent);height:28px;min-width:0;}
.numbox{display:flex;align-items:center;gap:4px;flex-shrink:0;}
.app input[type=number]{
  width:100px;padding:8px 10px;font-size:18px;text-align:right;
  border:1px solid #cfd6e0;border-radius:8px;font-family:inherit;background:#fff;color:inherit;
}
.app input:focus-visible{outline:2px solid var(--accent);outline-offset:1px;}
.unit{font-size:16px;color:var(--text-secondary);}

.choice{display:flex;gap:10px;}
.choice button{
  flex:1;padding:14px;font-size:17px;font-weight:700;font-family:inherit;cursor:pointer;
  background:#fff;border:2px solid #dfe4ec;border-radius:10px;color:var(--text-secondary);
}
.choice button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);}
.choice button:focus-visible{outline:3px solid var(--accent);outline-offset:2px;}

.btn{
  display:block;width:100%;padding:16px;font-size:19px;font-weight:700;font-family:inherit;
  background:var(--accent);color:#fff;border:0;border-radius:10px;cursor:pointer;
}
.btn:hover{background:#164e91;}
.btn-ghost{
  display:block;width:100%;padding:12px;margin-top:10px;font-size:16px;font-family:inherit;
  background:transparent;color:var(--text-secondary);border:0;cursor:pointer;text-decoration:underline;
}
.btn:focus-visible,.btn-ghost:focus-visible{outline:3px solid var(--accent);outline-offset:2px;}
.privacy{font-size:12.5px;color:var(--muted);margin:12px 0 0;text-align:center;line-height:1.6;}

/* ---------- 結果：3つ並列（合計資産／最低限／ゆとり） ---------- */
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
.plan{
  border:1px solid var(--border);border-radius:var(--radius);
  padding:18px 12px;text-align:center;background:var(--surface-1);
}
.plan.asset{background:#f2f7fe;border-color:rgba(42,120,214,.28);}
.plan.yutori{background:#fbf7f4;border-color:rgba(235,104,52,.25);}
.plan-ttl{font-size:15px;font-weight:700;margin:0 0 12px;color:var(--text-secondary);}
.plan-cap{font-size:13px;color:var(--muted);margin:0;}
.plan-gap{font-size:28px;font-weight:700;line-height:1.15;margin:2px 0 14px;color:var(--series-2);}
.plan-gap.total{color:var(--accent);}
.plan-gap.ok{color:var(--good);font-size:22px;}
.plan-gap small{font-size:15px;font-weight:700;margin-left:1px;}
.plan-mon{font-size:25px;font-weight:700;line-height:1.15;margin:2px 0 0;color:var(--accent);}
.plan-mon small{font-size:14px;font-weight:700;margin-left:1px;}
.plan-note{font-size:12.5px;color:var(--muted);margin:2px 0 0;line-height:1.7;}

/* ---------- 切り替えタブ ---------- */
.tabs{display:flex;gap:8px;margin:0 0 18px;}
.tabs button{
  flex:1;padding:10px 4px;font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;
  background:#fff;border:2px solid #dfe4ec;border-radius:10px;color:var(--text-secondary);
}
.tabs button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);}
.tabs button:focus-visible{outline:3px solid var(--accent);outline-offset:2px;}

/* 内訳 */
.breakdown{font-size:16px;}
.breakdown table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;}
.breakdown td{padding:7px 0;border-bottom:1px solid var(--grid);}
.breakdown td:last-child{text-align:right;white-space:nowrap;}
.breakdown tr.total td{font-weight:700;border-bottom:2px solid var(--baseline);}
.breakdown tr.sub td{color:var(--text-secondary);font-size:15px;}

/* グラフ */
.chart-wrap{position:relative;margin-top:8px;}
.legend{display:flex;gap:16px;font-size:14px;color:var(--text-secondary);margin-bottom:10px;flex-wrap:wrap;}
.legend span{display:flex;align-items:center;gap:6px;}
.swatch{width:12px;height:12px;border-radius:3px;display:inline-block;flex-shrink:0;}
.app svg{display:block;width:100%;height:auto;}
.tip{
  position:absolute;pointer-events:none;background:#fff;border:1px solid var(--border);
  border-radius:8px;padding:8px 10px;font-size:14px;box-shadow:0 4px 14px rgba(0,0,0,.10);
  white-space:nowrap;opacity:0;transition:opacity .1s;font-variant-numeric:tabular-nums;
}
.tip b{display:block;margin-bottom:3px;font-size:13px;color:var(--text-secondary);font-weight:600;}
.tip .li{display:flex;align-items:center;gap:6px;}

/* 表 */
.app details{margin-top:14px;font-size:15px;}
.app summary{cursor:pointer;color:var(--accent);}
.tbl-scroll{overflow-x:auto;}
.tbl{width:100%;border-collapse:collapse;margin-top:10px;font-variant-numeric:tabular-nums;}
.tbl th,.tbl td{padding:6px 8px;border-bottom:1px solid var(--grid);text-align:right;font-size:14px;white-space:nowrap;}
.tbl th:first-child,.tbl td:first-child{text-align:left;}
.tbl th{color:var(--text-secondary);font-weight:600;}

/* CTA */
.cta{
  background:linear-gradient(160deg,#1b5fb0,#123f78);color:#fff;border-radius:var(--radius);
  padding:26px 20px;text-align:center;margin-top:24px;
}
.cta h3{margin:0 0 16px;font-size:21px;}
.cta a{
  display:block;padding:15px;border-radius:10px;background:#fff;color:var(--accent);
  font-weight:700;text-decoration:none;font-size:18px;
}
.cta .stub{font-size:12.5px;opacity:.75;margin:10px 0 0;}
.cta .soon{
  margin:0;font-size:16px;line-height:1.7;opacity:.95;
  padding:14px;border:1px dashed rgba(255,255,255,.45);border-radius:10px;
}

.source{font-size:13px;color:var(--muted);margin-top:14px;line-height:1.6;}
.app .hidden{display:none !important;}
@media(prefers-reduced-motion:reduce){.app *{transition:none !important;}}
@media(max-width:760px){
  .three{grid-template-columns:1fr;}
  .plan-gap{font-size:40px;} .plan-gap.ok{font-size:30px;} .plan-mon{font-size:34px;}
  .plan-gap small{font-size:20px;} .plan-mon small{font-size:18px;}
}
@media(max-width:420px){
  .app input[type=number]{width:88px;}
  .steps button{font-size:13px;padding:9px 2px;}
}
</style>

<div class="app">

<div class="app-header">
  <h1>老後資金、いくら足りない？</h1>
</div>

<div class="wrap">

  <nav class="steps" aria-label="ステップ">
    <button id="st1" onclick="goStep(1)">1. 数字を入れる</button>
    <button id="st2" onclick="goStep(2)">2. 結果を見る</button>
  </nav>

  <!-- ===== STEP 1：入力 ===== -->
  <section id="step1" class="card">
    <h2>あなたのことを教えてください</h2>

    <div class="field">
      <label for="age">いまの年齢</label>
      <div class="row">
        <input type="range" id="ageR" min="20" max="80" step="1" value="40" aria-label="いまの年齢（スライダー）">
        <div class="numbox"><input type="number" id="age" min="20" max="80" step="1" value="40"><span class="unit">歳</span></div>
      </div>
    </div>

    <div class="field">
      <label for="retire">何歳まで働きますか</label>
      <div class="help">この年齢まで積み立てる計算になります。</div>
      <div class="row">
        <input type="range" id="retireR" min="21" max="85" step="1" value="65" aria-label="何歳まで働くか（スライダー）">
        <div class="numbox"><input type="number" id="retire" min="21" max="85" step="1" value="65"><span class="unit">歳</span></div>

    <!-- 年収は計算には使わない。統計を取るためだけの項目 -->
    <div class="field">
      <label for="income">いまの年収（税込）</label>
      <div class="row">
        <input type="range" id="incomeR" min="0" max="2000" step="10" value="500" aria-label="いまの年収（スライダー）">
        <div class="numbox"><input type="number" id="income" min="0" max="20000" step="10" value="500"><span class="unit">万円</span></div>

    <div class="field">

    <div class="field">
      <label for="spend">老後の生活費（1ヶ月）</label>

      <div class="row">

        <div class="numbox"><input type="number" id="extra" min="0" max="50" step="0.5" value="3"><span class="unit">万円</span></div>
      </div>
    </div>

    <div class="field">
      <label for="asset">いまの貯金・投資</label>
      <div class="row">
        <input type="range" id="assetR" min="0" max="5000" step="50" value="300" aria-label="いまの貯金・投資（スライダー）">

      <div class="row">
        <input type="range" id="taishokuR" min="0" max="5000" step="50" value="1000" aria-label="退職金の見込み（スライダー）">
        <div class="numbox"><input type="number" id="taishoku" min="0" max="50000" step="50" value="1000"><span class="unit">万円</span></div>
      </div>

    <button class="btn" onclick="showResult()">診断する</button>
    <p class="privacy">※ 入力内容は統計目的で記録されます。個人が特定される情報は取得しません。</p>
  </section>

  <!-- ===== STEP 2：結果 ===== -->
  <section id="step2" class="hidden">

    <div class="card">
      <button class="back" onclick="goStep(1)">← 数字を入れなおす</button>

      <div class="three">
        <div class="plan asset">
          <p class="plan-ttl">合計資産額</p>
          <p class="plan-cap">退職時に用意できるお金</p>
          <p class="plan-gap total" id="projTotal">—</p>
          <p class="plan-note" id="projBreak">—</p>
        </div>
        <div class="plan">
          <p class="plan-ttl">最低限の暮らし</p>
          <p class="plan-cap">足りない金額</p>
          <p class="plan-gap" id="gapMin">—</p>
          <p class="plan-cap">毎月の積立額</p>
          <p class="plan-mon" id="monMin">—</p>
        </div>
        <div class="plan yutori">
          <p class="plan-ttl">ゆとりある暮らし</p>
          <p class="plan-cap">足りない金額</p>
          <p class="plan-gap" id="gapYut">—</p>
          <p class="plan-cap">毎月の積立額</p>
          <p class="plan-mon" id="monYut">—</p>
        </div>
      </div>

      <div class="field" id="rateField" style="margin:26px 0 0;">
        <label for="rate">運用の利回りを変えてみる</label>
        <div class="row">
          <input type="range" id="rateR" min="0" max="10" step="0.5" value="5" aria-label="運用の利回り（スライダー）">
          <div class="numbox"><input type="number" id="rate" min="0" max="10" step="0.5" value="5"><span class="unit">%</span></div>
        </div>
      </div>
    </div>

    <div class="tabs">
      <button id="tabMin" class="on" onclick="setPlan('min')">最低限の暮らし</button>
      <button id="tabYut" onclick="setPlan('yutori')">ゆとりある暮らし</button>
    </div>

    <div class="card" id="chartCard">
      <h2>積み立てたお金の増え方</h2>
      <div class="legend">
        <span><i class="swatch" style="background:#2a78d6"></i>自分で積み立てたお金</span>
        <span><i class="swatch" style="background:#eb6834"></i>運用でふえたお金</span>
      </div>
      <div class="chart-wrap">
        <svg id="chart" viewBox="0 0 640 300" role="img" aria-label="積立の資産推移グラフ"></svg>
        <div class="tip" id="tip"></div>
      </div>
      <p class="source hidden" id="chartNote"></p>
      <details>

    <div class="card breakdown">
      <h2>計算の内訳</h2>
      <table id="bd"></table>
      <p class="source" id="source"></p>
    </div>

    <!-- ===== 導線枠（現在は置いていない） =====
         このツールはLINE登録後に配布するものなので、CTAは不要という判断（2026-07-31）。
         今後 VSL・ウェビナーなどへの導線を足すときは、ここに次を入れる。
         CSS（.cta / .cta a / .cta .soon）はそのまま残してあるので、貼るだけで使える。

         <div class="cta">
           <h3>見出し</h3>
           <a href="（動画やウェビナーのURL）">ボタンの文言</a>
         </div>
    ============================================ -->

    <button class="btn-ghost" onclick="goStep(1)">← 数字を入れなおす</button>
  </section>

</div>

<script>
/* ============ 設定値 ============ */
const PENSION_AGE = 65;   // 年金の受給開始＝老後のスタート
const END_AGE     = 90;   // 老後の終わり
const PREP_YEARS  = 25;   // 65〜90歳
const EXTRA_YEARS = 20;   // 臨時の出費に掛ける年数
const PENSION     = 20;   // 老後の月間収入（万円）
const YUTORI      = {1:4860, 2:6540};  // ゆとりある老後に必要な額（万円・固定値）

let house   = 2;
let plan    = 'min';   // グラフ／内訳に表示する方（'min' or 'yutori'）
let step    = 1;
let reached = 1;

/* ============ スライダー⇔数値の連動 ============ */
function link(id){
  const n = document.getElementById(id), r = document.getElementById(id+'R');
  n.addEventListener('input', ()=>{ r.value = n.value; onInput(id); });
  r.addEventListener('input', ()=>{ n.value = r.value; onInput(id); });
}
['age','retire','income','spend','extra','asset','taishoku','rate'].forEach(link);

const V = id => parseFloat(document.getElementById(id).value) || 0;

/* 「何歳まで働くか」は、いまの年齢より上でなければならない */
function clampRetire(changed){
  const age = V('age');
  const rMin = age + 1;
  const rn = document.getElementById('retire'), rr = document.getElementById('retireR');
  rn.min = rMin; rr.min = rMin;
  if(V('retire') < rMin){ rn.value = rMin; rr.value = rMin; }
}
function onInput(id){
  if(id === 'age' || id === 'retire') clampRetire(id);
  recalc();
}

/* ============ 画面切替 ============ */
function goStep(n){
  if(n > reached) return;
  step = n;
  [1,2].forEach(i=>{
    document.getElementById('step'+i).classList.toggle('hidden', i!==n);
    const chip = document.getElementById('st'+i);
    chip.classList.toggle('on', i===n);
    chip.classList.toggle('done', i!==n && i<=reached);
    chip.disabled = (i > reached || i === n);
  });
  if(n===2) recalc();
  try{ window.scrollTo({top:0,behavior:'smooth'}); }catch(e){ window.scrollTo(0,0); }
}
function setHouse(h){
  house = h;
  document.getElementById('h1').classList.toggle('on', h===1);
  document.getElementById('h2').classList.toggle('on', h===2);
  recalc();
}
function setPlan(p){
  plan = p;
  document.getElementById('tabMin').classList.toggle('on', p==='min');
  document.getElementById('tabYut').classList.toggle('on', p==='yutori');
  recalc();
}
function showResult(){ reached = 2; goStep(2); logResult(); }

/* ============ 診断結果の記録（統計用） ============
   Googleフォームの受け口に送るだけ。名前・メールなど個人を特定する情報は送らない。
   1人1回（最初に「診断する」を押したとき）だけ送る。
   送信に失敗しても診断の表示は止めない。 */
const LOG_URL = 'https://docs.google.com/forms/d/e/1FAIpQLSdkrxaGk1lwUQpATDSkTUFDsmRB2QvPogC4fAcF_n1Nrz9utg/formResponse';
const LOG_FIELDS = {
  age:      'entry.786398006',
  retire:   'entry.195256671',
  house:    'entry.1655379541',
  spend:    'entry.785823105',
  extra:    'entry.1135259931',
  asset:    'entry.277059322',
  taishoku: 'entry.1644346629',
  gapMin:   'entry.1286387535',
  gapYut:   'entry.799794714',
  src:      'entry.218670221',
  device:   'entry.1103356335',
  income:   'entry.1538740312'   /* 12. 年収（計算には使わない・統計用） */
};
let logged = false;

function logResult(){
  if(logged) return;
  logged = true;
  try{
    const d = calc();
    const q = new URLSearchParams(location.search);
    const v = {
      age: d.age, retire: d.retire, house: house, income: V('income'),
      spend: V('spend'), extra: V('extra'), asset: d.asset, taishoku: d.tai,
      gapMin: Math.round(d.min.gap), gapYut: Math.round(d.yutori.gap),
      src: q.get('src') || q.get('utm_source') || 'direct',
      device: window.innerWidth < 640 ? 'sp' : 'pc'
    };
    const body = new URLSearchParams();
    Object.keys(LOG_FIELDS).forEach(k => body.append(LOG_FIELDS[k], v[k]));
    fetch(LOG_URL, {method:'POST', mode:'no-cors', keepalive:true, body});
  }catch(e){ /* 記録に失敗しても診断はそのまま続ける */ }
}

let rzT;
window.addEventListener('resize', ()=>{
  clearTimeout(rzT);
  rzT = setTimeout(()=>{ if(step===2) recalc(); }, 150);
});

/* ============ 計算 ============ */
function calc(){
  const age    = V('age');
  const retire = Math.max(V('retire'), age);   // 積立を終える年齢＝働き終える年齢
  const asset  = V('asset');
  const tai    = V('taishoku');
  const rate   = V('rate');

  /* 老後（65〜90歳）に必要なお金 */
  const monthlyGap = V('spend') - PENSION;
  const living     = monthlyGap * 12 * PREP_YEARS;
  const extra      = V('extra') * 12 * EXTRA_YEARS;
  const needMin    = living + extra;
  const needYut    = YUTORI[house];

  const months = Math.max(0, (retire - age) * 12);   // 積立できる月数
  const i      = rate / 100 / 12;

  /* いまの貯金・投資も同じ利回りで運用する前提。退職金は退職時に受け取る */
  const grow      = (i === 0 || months === 0) ? 1 : Math.pow(1+i, months);
  const assetEnd  = asset * grow;          // 退職時点まで運用した貯金（万円）
  const projected = assetEnd + tai;        // 退職時に用意できる合計資産（万円）

  const build = need => {
    const gap = need - projected;
    let monthly = null;
    if(gap > 0 && months > 0){
      monthly = (i === 0) ? gap / months : gap * i / (Math.pow(1+i, months) - 1);
    }
    return {need, gap, monthly};
  };

  return {
    age, retire, asset, tai, rate, months, i,
    assetEnd, projected,
    parts: {monthlyGap, living, extra},
    min: build(needMin),
    yutori: build(needYut)
  };
}

/* ============ 表示フォーマット ============ */
const man = v => Math.round(v).toLocaleString('ja-JP');                 // 万円
const yen = v => (Math.round(v*10000/100)*100).toLocaleString('ja-JP'); // 万円→円（100円単位）

/* ============ 再計算＆描画 ============ */
function recalc(){
  if(step !== 2) return;
  const d = calc();

  /* 1つ目のカード：退職時に用意できる合計資産 */
  document.getElementById('projTotal').innerHTML = man(d.projected) + '<small>万円</small>';
  /* カードが狭いので、途中で変な折り返しが起きないよう1行ずつに分ける */
  const brk = [`貯金 ${man(d.asset)}万円`];
  if(d.assetEnd > d.asset) brk.push(`→ 運用で ${man(d.assetEnd)}万円`);
  brk.push(`＋ 退職金 ${man(d.tai)}万円`);
  document.getElementById('projBreak').innerHTML = brk.join('<br>');

  paintPlan(d, 'min',    'gapMin', 'monMin');
  paintPlan(d, 'yutori', 'gapYut', 'monYut');

  drawChart(d);
  drawBreakdown(d);
}

function paintPlan(d, key, gapId, monId){
  const p  = d[key];
  const gEl = document.getElementById(gapId);
  const mEl = document.getElementById(monId);

  if(p.gap <= 0){
    gEl.className = 'plan-gap ok';
    gEl.innerHTML = '達成ずみ';
    mEl.innerHTML = '0<small>円</small>';
    return;
  }
  gEl.className = 'plan-gap';
  gEl.innerHTML = man(p.gap) + '<small>万円</small>';

  if(d.months <= 0){
    mEl.innerHTML = '—';
  }else{
    mEl.innerHTML = yen(p.monthly) + '<small>円</small>';
  }
}

/* ============ 内訳テーブル ============ */
function drawBreakdown(d){
  const p = d[plan];
  let rows = '';

  if(plan === 'min'){
    const q = d.parts;
    rows += `<tr><td>毎月の生活費のうち、年金でまかなえない分</td><td>${q.monthlyGap>=0?'':'−'}${man(Math.abs(q.monthlyGap))}万円 / 月</td></tr>`;
    rows += `<tr class="sub"><td>　↑ を 25年分（65〜90歳）</td><td>${man(q.living)}万円</td></tr>`;
    rows += `<tr class="sub"><td>臨時の出費 ${V('extra')}万円 × 20年分</td><td>${man(q.extra)}万円</td></tr>`;
    rows += `<tr class="total"><td>老後に必要なお金</td><td>${man(p.need)}万円</td></tr>`;
  }else{
    rows += `<tr><td>ゆとりある老後に必要なお金（${house===1?'一人暮らし':'二人暮らし'}）</td><td>${man(p.need)}万円</td></tr>`;
  }
  rows += `<tr class="sub"><td>− いまの貯金・投資 ${man(d.asset)}万円${d.assetEnd>d.asset?`（運用して ${man(d.assetEnd)}万円に）`:''}</td><td>${man(d.assetEnd)}万円</td></tr>`;
  rows += `<tr class="sub"><td>− 退職金の見込み</td><td>${man(d.tai)}万円</td></tr>`;
  rows += `<tr class="total"><td>${p.gap>0?'足りない金額':'余る金額'}</td><td>${man(Math.abs(p.gap))}万円</td></tr>`;
  document.getElementById('bd').innerHTML = rows;

  /* 注記。計算の前提は常に両方出す。
     65歳より前に働き終える人にだけ、空白期間の注記を足す */
  const notes = [
    '※ 老後の収入（年金など）は月20万円、老後期間は65〜90歳として計算しています。',
    '※ ゆとりある暮らしに必要な額は、一人暮らし4,860万円／二人暮らし6,540万円（65〜90歳）を目安として計算しています。'
  ];
  if(d.rate > 0 && d.months > 0){
    notes.push('※ いまの貯金・投資も、同じ利回りで運用し続けた前提で計算しています。');
  }
  if(d.retire < PENSION_AGE){
    notes.push(`※ 年金を受け取れるのは65歳からのため、${d.retire}歳〜65歳の生活費はこの金額に含まれていません。`);
  }
  document.getElementById('source').innerHTML = notes.map(t=>`<span style="display:block">${t}</span>`).join('');
}

/* ============ グラフ ============ */
const S1='#2a78d6', S2='#eb6834', SURF='#ffffff';
let chartPts = [];

function drawChart(d){
  const svg  = document.getElementById('chart');
  const note = document.getElementById('chartNote');
  const p    = d[plan];

  if(!(p.gap > 0 && d.months > 0)){
    svg.innerHTML = '';
    chartPts = [];
    document.getElementById('tbl').innerHTML = '';
    note.textContent = p.gap<=0
      ? 'すでに必要額に届いているため、グラフは表示していません。'
      : '積立期間がないため、グラフは表示していません。';
    note.classList.remove('hidden');
    return;
  }
  note.classList.add('hidden');

  /* データ生成：年ごとの 元本 / 評価額 */
  const pts = [];
  for(let y=0; y<=d.months/12; y++){
    const m = y*12;
    const principal = p.monthly * m;
    const value = (d.i===0) ? principal : p.monthly * (Math.pow(1+d.i, m)-1) / d.i;
    pts.push({age:d.age+y, principal, value, profit:value-principal});
  }
  chartPts = pts;

  /* スケール：SVGの実寸をそのままviewBoxにして、文字が小さくならないようにする */
  const W = Math.round(svg.clientWidth) || 640;
  const H = W < 480 ? 250 : 300;
  const ml = W < 480 ? 50 : 62, mr = 16, mt = 30, mb = 34;
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  const pw=W-ml-mr, ph=H-mt-mb;
  const maxV = pts[pts.length-1].value;
  const tick = niceTick(maxV);
  const top  = Math.ceil(maxV/tick)*tick;
  const x = i => ml + pw * (pts.length===1 ? 0 : i/(pts.length-1));
  const y = v => mt + ph * (1 - v/top);

  let g='';
  for(let v=0; v<=top+1; v+=tick){
    g += `<line x1="${ml}" y1="${y(v)}" x2="${W-mr}" y2="${y(v)}" stroke="${v===0?'#c3c2b7':'#e6e9ef'}" stroke-width="1"/>`;
    g += `<text x="${ml-8}" y="${y(v)+4}" text-anchor="end" font-size="12.5" fill="#767570" style="font-variant-numeric:tabular-nums">${man(v)}</text>`;
  }
  g += `<text x="${ml-8}" y="12" text-anchor="end" font-size="11.5" fill="#767570">万円</text>`;

  const n = pts.length-1;
  const st = Math.max(1, Math.round(n/4));
  const idxs = [];
  for(let i=0;i<=n;i+=st) idxs.push(i);
  if(idxs[idxs.length-1] !== n){
    if(n - idxs[idxs.length-1] < st*0.6) idxs.pop();
    idxs.push(n);
  }
  idxs.forEach(i=>{
    g += `<text x="${x(i)}" y="${H-12}" text-anchor="middle" font-size="12.5" fill="#767570">${pts[i].age}歳</text>`;
  });

  const path = (key,base) => {
    let up = pts.map((q,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(q[key]).toFixed(1)}`).join('');
    let dn = base
      ? pts.slice().reverse().map((q,i)=>`L${x(pts.length-1-i).toFixed(1)},${y(q[base]).toFixed(1)}`).join('')
      : `L${x(pts.length-1).toFixed(1)},${y(0)}L${ml},${y(0)}`;
    return up+dn+'Z';
  };
  g += `<path d="${path('value','principal')}" fill="${S2}" fill-opacity="0.18"/>`;
  g += `<path d="${path('principal',null)}" fill="${S1}" fill-opacity="0.18"/>`;
  const line = key => pts.map((q,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(q[key]).toFixed(1)}`).join('');
  g += `<path d="${line('value')}" fill="none" stroke="${SURF}" stroke-width="6" stroke-linejoin="round"/>`;
  g += `<path d="${line('value')}" fill="none" stroke="${S2}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  g += `<path d="${line('principal')}" fill="none" stroke="${SURF}" stroke-width="6" stroke-linejoin="round"/>`;
  g += `<path d="${line('principal')}" fill="none" stroke="${S1}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;

  const last = pts[pts.length-1];
  g += `<circle cx="${x(pts.length-1)}" cy="${y(last.value)}" r="5" fill="${S2}" stroke="${SURF}" stroke-width="2"/>`;
  g += `<circle cx="${x(pts.length-1)}" cy="${y(last.principal)}" r="5" fill="${S1}" stroke="${SURF}" stroke-width="2"/>`;

  g += `<line id="cross" x1="0" y1="${mt}" x2="0" y2="${mt+ph}" stroke="#c3c2b7" stroke-width="1" opacity="0"/>`;
  g += `<rect id="hit" x="${ml}" y="${mt}" width="${pw}" height="${ph}" fill="transparent"/>`;

  svg.innerHTML = g;
  svg._geo = {ml,pw,mt,ph,W,x,y};
  svg.style.height = H + 'px';
  bindHover(svg);
  drawTable(pts);
}

function niceTick(max){
  const raw = Math.max(max,1)/4;
  const pow = Math.pow(10, Math.floor(Math.log10(raw)));
  const n = raw/pow;
  return (n<=1?1:n<=2?2:n<=5?5:10)*pow;
}

function bindHover(svg){
  const tip = document.getElementById('tip');
  const cross = svg.querySelector('#cross');
  const move = e=>{
    if(!chartPts.length) return;
    const r = svg.getBoundingClientRect();
    const cx = e.touches ? e.touches[0].clientX : e.clientX;
    const {ml,pw,W} = svg._geo;
    const sx = (cx - r.left) / r.width * W;
    let idx = Math.round((sx-ml)/pw*(chartPts.length-1));
    idx = Math.max(0, Math.min(chartPts.length-1, idx));
    const p = chartPts[idx];
    cross.setAttribute('x1', svg._geo.x(idx)); cross.setAttribute('x2', svg._geo.x(idx));
    cross.setAttribute('opacity','1');
    tip.innerHTML =
      `<b>${p.age}歳の時点</b>`+
      `<div class="li"><i class="swatch" style="background:${S1}"></i>積み立てたお金　${man(p.principal)}万円</div>`+
      `<div class="li"><i class="swatch" style="background:${S2}"></i>運用でふえた分　${man(p.profit)}万円</div>`+
      `<div class="li" style="margin-top:4px;font-weight:700">合計　${man(p.value)}万円</div>`;
    tip.style.opacity = 1;
    const px = svg._geo.x(idx)/W*r.width;
    tip.style.left = Math.max(0, Math.min(px-100, r.width-210))+'px';
    tip.style.top = '10px';
  };
  svg.addEventListener('mousemove', move);
  svg.addEventListener('touchmove', e=>{move(e);e.preventDefault();}, {passive:false});
  svg.addEventListener('mouseleave', ()=>{tip.style.opacity=0;cross.setAttribute('opacity','0');});
}

function drawTable(pts){
  let h = '<tr><th>年齢</th><th>積み立てたお金</th><th>運用でふえた分</th><th>合計</th></tr>';
  pts.forEach(p=>{
    h += `<tr><td>${p.age}歳</td><td>${man(p.principal)}万円</td><td>${man(p.profit)}万円</td><td>${man(p.value)}万円</td></tr>`;
  });
  document.getElementById('tbl').innerHTML = h;
}

clampRetire();
goStep(1);
</script>
